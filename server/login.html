<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex, nofollow">
  <title>Accesso – Heineken Pioneer</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --navy: #205527; --navy-dark: #17401d; --ink: #16261a; --muted: #5d7262; --line: #d5dbe3; --error: #b42318; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 32px 20px;
      background: #fff;
      color: var(--ink);
      font: 16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .logo { width: min(460px, 84vw); height: auto; aspect-ratio: 2817 / 1228; display: block; animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 6px;
      padding: 36px 32px 32px;
      border: 1px solid var(--line);
      box-shadow: 0 18px 48px rgba(22, 38, 26, 0.12);
      animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.08s both;
    }
    h1 { margin: 0 0 6px; font-family: "Inter Tight", Inter, sans-serif; font-weight: 600; font-size: 24px; letter-spacing: -0.01em; color: var(--navy); }
    .lead { margin: 0 0 28px; color: var(--muted); font-size: 15px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
    .field { position: relative; }
    input[type="password"], input[type="text"] {
      width: 100%;
      height: 52px;
      padding: 0 52px 0 16px;
      border: 1px solid var(--line);
      border-radius: 4px;
      font: inherit;
      font-size: 16px; /* evita lo zoom automatico su iPhone */
      color: var(--ink);
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(122, 184, 0, 0.35); }
    .has-error input { border-color: var(--error); }
    .masked { -webkit-text-security: disc; text-security: disc; }
    .toggle {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .toggle:hover { color: var(--navy); }
    .toggle:focus-visible, .submit:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
    .toggle svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .toggle .hide { display: none; }
    .toggle[aria-pressed="true"] .show { display: none; }
    .toggle[aria-pressed="true"] .hide { display: block; }
    .error { display: flex; align-items: center; gap: 8px; margin: 12px 0 0; color: var(--error); font-size: 14px; font-weight: 500; }
    .error::before { content: "!"; display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--error); color: #fff; font-size: 12px; font-weight: 700; flex: none; }
    .submit {
      width: 100%;
      height: 52px;
      margin-top: 24px;
      border: 0;
      border-radius: 4px;
      background: var(--navy);
      color: #fff;
      font: 600 16px Inter, system-ui, sans-serif;
      cursor: pointer;
      transition: background 0.15s;
    }
    .submit:hover { background: var(--navy-dark); }
    .submit:disabled { opacity: 0.7; cursor: progress; }
    .note { margin: 20px 0 0; color: var(--muted); font-size: 13px; text-align: center; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
    @media (max-width: 420px) {
      body { gap: 28px; }
      .card { padding: 28px 22px 24px; }
      h1 { font-size: 22px; }
    }
    @media (prefers-reduced-motion: reduce) { .logo, .card { animation: none; } }
  </style>
</head>
<body>
  <img class="logo" src="/assets/logo-animato.svg" alt="Heineken – Pioneer. Grow. Together.">

  <main class="card">
    <h1>Le foto dell'evento</h1>
    <p class="lead">Inserisci la password che hai ricevuto per vedere e scaricare le foto.</p>

    <form method="post" action="/login" class="{{ERROR_CLASS}}" id="login">
      <input type="hidden" name="next" value="{{NEXT}}">
      <label for="password">Password</label>
      <div class="field">
        <!-- Campo di testo con i caratteri mascherati: i browser non lo trattano come password
             da salvare. Dove il mascheramento CSS non esiste, lo script lo rende un campo password. -->
        <input id="password" name="password" type="text" class="masked" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-form-type="other" required autofocus>
        <button class="toggle" type="button" aria-label="Mostra password" aria-pressed="false" aria-controls="password">
          <svg class="show" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="hide" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8M9.9 5.1A10.4 10.4 0 0112 5c6.5 0 10 7 10 7a17.7 17.7 0 01-3.2 4.2M6.1 6.1A17.6 17.6 0 002 12s3.5 7 10 7a9.8 9.8 0 005.1-1.4"/></svg>
        </button>
      </div>
      {{ERROR}}
      <button class="submit" type="submit">Entra</button>
    </form>

    <p class="note">Area riservata ai partecipanti.</p>
  </main>

  <script>
    var input = document.getElementById("password");
    var toggle = document.querySelector(".toggle");
    // Senza mascheramento CSS si torna al campo password classico (codice monouso, non da salvare).
    var cssMask = window.CSS && CSS.supports && CSS.supports("-webkit-text-security", "disc");
    if (!cssMask) {
      input.classList.remove("masked");
      input.type = "password";
      input.setAttribute("autocomplete", "one-time-code");
    }
    toggle.addEventListener("click", function () {
      var hidden = cssMask ? input.classList.contains("masked") : input.type === "password";
      if (cssMask) input.classList.toggle("masked", !hidden);
      else input.type = hidden ? "text" : "password";
      toggle.setAttribute("aria-pressed", String(hidden));
      toggle.setAttribute("aria-label", hidden ? "Nascondi password" : "Mostra password");
      input.focus();
    });
    document.getElementById("login").addEventListener("submit", function (e) {
      var btn = e.target.querySelector(".submit");
      btn.disabled = true;
      btn.textContent = "Accesso…";
    });
  </script>
</body>
</html>
